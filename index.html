<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cinemas">
<meta name="theme-color" content="#0d0d12">
<title>Bahrain Cinemas</title>
<style>
  :root { --bg:#0d0d12; --card:#18181f; --line:#2a2a33; --text:#f2f2f5; --muted:#8b8b96; --accent:#e50914; --chip:#23232c; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding-bottom:env(safe-area-inset-bottom); }
  header { position:sticky; top:0; z-index:5; background:rgba(13,13,18,.92); backdrop-filter:blur(12px); padding:calc(env(safe-area-inset-top) + 12px) 16px 10px; border-bottom:1px solid var(--line); }
  h1 { margin:0 0 10px; font-size:24px; letter-spacing:-.3px; }
  .search { width:100%; padding:10px 14px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:16px; outline:none; }
  .chips { display:flex; gap:8px; overflow-x:auto; padding:10px 0 2px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:0 0 auto; padding:7px 13px; border-radius:999px; background:var(--chip); color:var(--text); border:1px solid transparent; font-size:14px; cursor:pointer; white-space:nowrap; }
  .chip.on { background:var(--accent); }
  .chip.off { opacity:.35; }
  .chip small { display:block; font-size:11px; color:var(--muted); }
  .chip.on small { color:#ffd5d7; }
  .cinema .row { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:4px; }
  .cinema .row h4 { margin:0; }
  .book { flex:0 0 auto; background:var(--accent); color:#fff; text-decoration:none; font-size:13px; font-weight:600; padding:6px 12px; border-radius:999px; }
  a.time { color:var(--text); text-decoration:none; }
  a.time:active { background:var(--accent); border-color:var(--accent); }
  main { padding:14px 16px 30px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; }
  .card { cursor:pointer; }
  .poster { width:100%; aspect-ratio:2/3; border-radius:12px; background:var(--card) center/cover no-repeat; display:flex; align-items:flex-end; padding:8px; color:var(--muted); font-size:13px; }
  .card h3 { margin:7px 0 2px; font-size:14px; line-height:1.25; }
  .card p { margin:0; color:var(--muted); font-size:12.5px; }
  .empty { color:var(--muted); text-align:center; padding:40px 10px; }
  .back { background:none; border:0; color:var(--accent); font-size:16px; padding:0 0 8px; cursor:pointer; }
  .hero { display:flex; gap:14px; align-items:flex-start; margin-bottom:6px; }
  .hero .poster { width:96px; flex:0 0 96px; }
  .hero h2 { margin:2px 0 6px; font-size:20px; line-height:1.2; }
  .cinema { background:var(--card); border-radius:14px; padding:12px 14px; margin-top:12px; }
  .cinema h4 { margin:0 0 8px; font-size:15px; }
  .exp { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.5px; margin:8px 0 6px; }
  .times { display:flex; flex-wrap:wrap; gap:7px; }
  .time { padding:6px 11px; border-radius:9px; border:1px solid var(--line); font-size:14px; font-variant-numeric:tabular-nums; }
  .time.past { opacity:.35; text-decoration:line-through; }
  .time small { color:var(--muted); margin-left:4px; }
  footer { color:var(--muted); font-size:12px; text-align:center; padding:10px 16px 24px; }
  .filters { padding-top:8px; }
  .filters .chip { padding:5px 11px; font-size:13px; background:transparent; border-color:var(--line); }
  .filters .chip.on { background:var(--text); color:var(--bg); border-color:var(--text); }
  .filters .sep { flex:0 0 1px; background:var(--line); margin:4px 2px; }
  .badges { display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }
  .badge { font-size:10.5px; font-weight:600; letter-spacing:.3px; padding:2px 6px; border-radius:5px; background:var(--chip); color:var(--muted); }
  .badge.hot { background:#3a1215; color:#ff8a90; }
  .note { color:var(--muted); font-size:12.5px; text-align:center; margin:16px 0 0; }
  .note button { background:none; border:0; color:var(--accent); font-size:12.5px; padding:0; cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1 id="heading">Bahrain Cinemas</h1>
  <div id="controls">
    <input class="search" id="search" type="search" placeholder="Search films" autocomplete="off">
  </div>
  <div class="chips" id="dates"></div>
  <div class="chips filters" id="filters"></div>
</header>
<main id="view"><p class="empty">Loading showtimes…</p></main>
<footer id="foot"></footer>

<script>
function load(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:JSON.parse(v); }catch(e){ return d; } }
function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
const state = { data:null, date:null, q:"", hideIndian:load("hideIndian",true), fmt:"All" };

// Groups each cinema's own format names into a few filter buttons.
const FORMATS = [
  ["IMAX", /imax/i], ["MAX", /\bmax\b/i], ["4DX", /4dx/i], ["ScreenX", /screen\s*x/i], ["3D", /\b3d\b/i],
  ["VIP", /vip|theatre|gold|platinum|luxe|premium|prestige|velvet|suite|recliner/i], ["Kids", /kids|junior|family/i],
];
function fmtGroup(exp){ for(const [k,rx] of FORMATS) if(rx.test(exp||"")) return k; return "Standard"; }
const FMT_ORDER = ["Standard","IMAX","MAX","VIP","3D","4DX","ScreenX","Kids"];
const HOT = new Set(["IMAX","MAX","VIP","4DX","ScreenX"]);
function dayShows(m){ return m.shows.filter(s=>s.date===state.date && (state.fmt==="All" || fmtGroup(s.exp)===state.fmt)); }
function visibleMovies(){ return state.data.movies.filter(m=>!(state.hideIndian && m.indian)); }

function renderFilters(){
  const box=document.getElementById("filters"); box.innerHTML="";
  const fm=new Set(); visibleMovies().forEach(m=>m.shows.forEach(s=>{ if(s.date===state.date) fm.add(fmtGroup(s.exp)); }));
  if(state.fmt!=="All" && !fm.has(state.fmt)) state.fmt="All";
  const ind=$("button","chip"+(state.hideIndian?" on":""),state.hideIndian?"Indian films hidden":"Hide Indian films");
  ind.onclick=()=>{ state.hideIndian=!state.hideIndian; save("hideIndian",state.hideIndian); route(false); };
  box.append(ind,$("span","sep"));
  ["All",...FMT_ORDER.filter(f=>fm.has(f))].forEach(f=>{
    const c=$("button","chip"+(state.fmt===f?" on":""),f==="All"?"All formats":f==="VIP"?"VIP / Luxury":f);
    c.onclick=()=>{ state.fmt=f; route(false); };
    box.appendChild(c);
  });
}
const $ = (tag, cls, text) => { const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; };

function todayISO(){ const d=new Date(Date.now()+3*3600e3); return d.toISOString().slice(0,10); }
function minutes(t){ const m=t.match(/(\d+):(\d+)\s*(am|pm)/i); if(!m) return 0; let h=+m[1]%12; if(m[3].toLowerCase()==="pm") h+=12; let v=h*60+ +m[2]; if(v<5*60) v+=24*60; return v; }
function dayLabel(iso){ const t=todayISO(); if(iso===t) return "Today"; const tm=new Date(t); tm.setDate(tm.getDate()+1); if(iso===tm.toISOString().slice(0,10)) return "Tomorrow"; return new Date(iso+"T12:00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}); }
function isPast(date,time){ if(date!==todayISO()) return false; const now=new Date(Date.now()+3*3600e3); let n=now.getUTCHours()*60+now.getUTCMinutes(); if(n<5*60) n+=24*60; return minutes(time)<n-10; }

function dates(){ const s=new Set(); state.data.movies.forEach(m=>m.shows.forEach(x=>s.add(x.date))); return [...s].sort(); }
function next7(){ const out=[], t=new Date(todayISO()+"T12:00:00Z"); for(let i=0;i<7;i++){ const d=new Date(t); d.setUTCDate(t.getUTCDate()+i); out.push(d.toISOString().slice(0,10)); } return out; }

// Where each chain sells tickets. VOX has a page per film; the others open their booking site.
const BOOK = [
  [/vox/i, t => "https://bhr.voxcinemas.com/movies/" + t.toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g,"").replace(/&/g,"and").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")],
  [/cineco/i, () => "https://www.cineco.net/country-chooser.php?country=bhr"],
  [/epix|liwan/i, () => "https://www.epixcinemas.com/"],
  [/mukta/i, () => "https://muktaa2cinemas.com/bahrain"],
  [/reel/i, () => "https://www.reelcinemas.com/en-bh/"],
  [/cin[eé]polis/i, () => "https://cinepolisgulf.com/"],
];
function bookUrl(show, title){ for(const [rx,f] of BOOK) if(rx.test(show.cinema)) return f(title); return show.url || "https://elcinema.com/en/theater/6/"; }

function renderDates(filmId){
  const box=document.getElementById("dates"); box.innerHTML="";
  const film=filmId && state.data.movies.find(x=>x.id===filmId);
  const have=new Set((film?film.shows:state.data.movies.flatMap(m=>m.shows)).map(s=>s.date));
  next7().forEach(d=>{
    const lbl=dayLabel(d), dt=new Date(d+"T12:00:00");
    const c=$("button","chip"+(d===state.date?" on":"")+(have.has(d)?"":" off"),lbl);
    if(lbl==="Today"||lbl==="Tomorrow") c.appendChild($("small",null,dt.toLocaleDateString("en-GB",{day:"numeric",month:"short"})));
    c.onclick=()=>{ state.date=d; route(); };
    box.appendChild(c);
  });
}

function renderList(){
  document.getElementById("heading").textContent="Bahrain Cinemas";
  document.getElementById("controls").style.display="";
  const view=document.getElementById("view"); view.innerHTML="";
  const q=state.q.trim().toLowerCase();
  const list=visibleMovies().filter(m=>dayShows(m).length && (!q || m.title.toLowerCase().includes(q)));
  const hidden=state.hideIndian?state.data.movies.filter(m=>m.indian && m.shows.some(s=>s.date===state.date)).length:0;
  if(!list.length){
    view.appendChild($("p","empty",!dates().includes(state.date)?"Times for this day aren't out yet. Cinemas usually publish them a few days ahead.":q?"No films match your search.":"Nothing in this format today. Try another format or day."));
  } else {
    const grid=$("div","grid");
    list.forEach(m=>{
      const shows=dayShows(m);
      const n=new Set(shows.map(s=>s.cinema)).size;
      const card=$("div","card");
      const p=$("div","poster"); if(m.poster) p.style.backgroundImage=`url("${encodeURI(m.poster)}")`; else p.textContent=m.title;
      const fm=FMT_ORDER.filter(f=>f!=="Standard" && m.shows.some(s=>s.date===state.date && fmtGroup(s.exp)===f));
      const b=$("div","badges"); fm.forEach(f=>b.appendChild($("span","badge"+(HOT.has(f)?" hot":""),f)));
      if(m.lang && m.lang[0] && !/english/i.test(m.lang[0])) b.appendChild($("span","badge",m.lang[0]));
      card.append(p,$("h3",null,m.title),$("p",null,`${n} cinema${n>1?"s":""} · ${shows.length} shows`),b);
      card.onclick=()=>{ location.hash="film/"+m.id; };
      grid.appendChild(card);
    });
    view.appendChild(grid);
  }
  if(hidden){
    const note=$("p","note",`${hidden} Indian film${hidden>1?"s":""} hidden · `);
    const sh=$("button",null,"Show them"); sh.onclick=()=>{ state.hideIndian=false; save("hideIndian",false); route(false); };
    note.appendChild(sh); view.appendChild(note);
  }
}

function renderFilm(id){
  const m=state.data.movies.find(x=>x.id===id); if(!m){ location.hash=""; return; }
  document.getElementById("controls").style.display="none";
  document.getElementById("heading").textContent=m.title;
  const view=document.getElementById("view"); view.innerHTML="";
  const back=$("button","back","‹ All films"); back.onclick=()=>history.length>1?history.back():(location.hash=""); view.appendChild(back);
  const hero=$("div","hero"); const p=$("div","poster"); if(m.poster) p.style.backgroundImage=`url("${encodeURI(m.poster)}")`;
  const info=$("div"); info.append($("h2",null,m.title),$("p",null,dayLabel(state.date)));
  const facts=[(m.lang||[]).join(", "),(m.country||[]).join(", "),(m.genres||[]).slice(0,3).join(", ")].filter(Boolean);
  if(facts.length) info.appendChild($("p","exp",facts.join(" · ")));
  hero.append(p,info); view.appendChild(hero);
  const shows=dayShows(m);
  if(!shows.length){ view.appendChild($("p","empty",state.fmt==="All"?"Not showing on this day. Pick a brighter date above.":"Not showing in "+state.fmt+" on this day. Try All formats.")); return; }
  const byCinema={}; shows.forEach(s=>((byCinema[s.cinema]??={})[s.exp]??=[]).push(s));
  Object.keys(byCinema).sort().forEach(c=>{
    const box=$("div","cinema");
    const first=Object.values(byCinema[c])[0][0], link=bookUrl(first,m.title);
    const row=$("div","row"); const bk=$("a","book","Book ›"); bk.href=link; bk.target="_blank"; bk.rel="noopener";
    row.append($("h4",null,c),bk); box.appendChild(row);
    Object.entries(byCinema[c]).forEach(([exp,list])=>{
      box.appendChild($("div","exp",exp));
      const t=$("div","times");
      list.sort((a,b)=>minutes(a.time)-minutes(b.time)).forEach(s=>{
        const el=$("a","time"+(isPast(s.date,s.time)?" past":""),s.time);
        el.href=link; el.target="_blank"; el.rel="noopener";
        if(s.price){ el.appendChild($("small",null,s.price+" BD")); }
        t.appendChild(el);
      });
      box.appendChild(t);
    });
    view.appendChild(box);
  });
}

function route(scroll=true){
  const h=location.hash.slice(1);
  renderDates(h.startsWith("film/")?h.slice(5):null);
  renderFilters();
  if(h.startsWith("film/")) renderFilm(h.slice(5)); else renderList();
  if(scroll) window.scrollTo(0,0);
}

document.getElementById("search").addEventListener("input",e=>{ state.q=e.target.value; renderList(); });
window.addEventListener("hashchange",route);

fetch("data.json?v="+Date.now()).then(r=>{ if(!r.ok) throw 0; return r.json(); }).then(d=>{
  state.data=d;
  const ds=dates(); const t=todayISO(); state.date=ds.includes(t)?t:(ds[0]||t);
  const up=new Date(d.updated);
  document.getElementById("foot").textContent=`${d.cinemas.length} cinemas · updated ${up.toLocaleString("en-GB",{timeZone:"Asia/Bahrain",weekday:"short",hour:"2-digit",minute:"2-digit"})}`;
  route();
}).catch(()=>{ document.getElementById("view").innerHTML='<p class="empty">No showtimes yet. The first update hasn\'t run.</p>'; });
</script>
</body>
</html>
