name: Update showtimes
on:
  schedule:
    - cron: "17 3,11 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4 playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scrape.py
      - run: |
          git config user.name "showtimes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json debug
          git diff --cached --quiet || git commit -m "Update showtimes"
          git push
